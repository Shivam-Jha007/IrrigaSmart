# Render Blueprint for the IrrigaSmart backend (docs/DEPLOYMENT.md).
# Render auto-detects this file when you create a service from the repo.
#
# The frontend is deployed separately on Vercel — see DEPLOYMENT.md. Persistent
# farmer/farm data lives client-side in IndexedDB (offline-first MVP), so the
# backend is stateless and needs no database.

services:
  - type: web
    name: irrigasmart-backend
    runtime: node
    plan: free
    # Monorepo (npm workspaces): install at the repo root, then build only the
    # backend workspace. tsc emits to backend/dist.
    #
    # --include=dev is required: NODE_ENV=production (set below, for runtime)
    # would otherwise make npm skip devDependencies, but the build needs the
    # TypeScript compiler and type definitions (@types/node, @types/cors) that
    # live in devDependencies. The flag forces them to install for the build.
    buildCommand: npm install --include=dev && npm run build --workspace backend
    startCommand: npm run start --workspace backend
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Ensures Express does not emit stack traces in error responses.
      - key: NODE_ENV
        value: production
      # Set this in the Render dashboard to your deployed Vercel URL AFTER the
      # frontend is live, e.g. https://irrigasmart.vercel.app. sync:false keeps
      # it out of source control.
      - key: CORS_ORIGIN
        sync: false
      # Provider key(s) for the farmer assistant (backend/src/assistant.ts). Set
      # ONE of these in the Render dashboard; sync:false keeps them out of source
      # control, and neither must ever be given a VITE_ prefix or moved to the
      # frontend, which would publish it in the browser bundle.
      #
      # Optional by design: with neither key set, the /api/assistant route
      # answers 503 ASSISTANT_DISABLED and the app falls back to its on-device
      # rules, so the farmer still gets advice. Check which mode a deployment is
      # in with /health, which reports `assistant: configured | disabled`.
      #
      # If both are set, ANTHROPIC_API_KEY takes priority.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Google Gemini — has a free tier with no billing account required, so
      # this is the option that costs nothing to enable.
      - key: GEMINI_API_KEY
        sync: false
      # Optional, and deliberately NOT declared here: GEMINI_MODEL overrides the
      # model the Gemini path calls (default gemini-flash-lite-latest). It is left
      # out of this blueprint because an unrecognised id would silently disable
      # the assistant on every deploy that inherited it; add it in the dashboard
      # only when moving to a specific model, and verify with /health.
